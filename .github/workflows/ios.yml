# Builds an unsigned CricMobile.ipa on a GitHub Mac. Install it from Windows with Sideloadly (it signs it with your Apple ID).
name: Build iOS app
on:
  push:
  workflow_dispatch:
permissions:
  contents: write # to publish the in-app update bundle as a release
jobs:
  ios:
    runs-on: macos-15
    env:
      BUILD_VERSION: ${{ github.run_number }}
    defaults:
      run:
        working-directory: cricmobile-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build game
        run: |
          npm ci
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          node build.mjs
          mkdir -p www && cp dist/cricmobile.html www/index.html
      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          cp dist/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $plist || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $plist || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION" $plist
      - name: Build unsigned IPA
        working-directory: cricmobile-source/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr CricMobile.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CricMobile-ipa
          path: cricmobile-source/ios/App/CricMobile.ipa
      - name: Publish in-app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd www && zip -qr ../bundle.zip .)
          echo "{\"build\": $BUILD_VERSION}" > version.json
          gh release create "build-$BUILD_VERSION" bundle.zip version.json ios/App/CricMobile.ipa --title "Build $BUILD_VERSION" --notes "Game update $BUILD_VERSION" --latest
